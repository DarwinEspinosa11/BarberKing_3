<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BarberKing | Mis Citas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='themify-icons-font/themify-icons/themify-icons.css') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="header" role="banner">
    <a href="/" class="header__logo">
      <img src="{{ url_for('static', filename='img/logo2.png') }}" alt="Logo BarberKing" />
      <span>BARBERKING</span>
    </a>
    <nav class="header__nav">
      <a href="/#servicios" data-i18n="nav.servicios">Inicio</a>
      <a href="/#agendar" data-i18n="nav.agendar">Agendar</a>
      <a href="/mis-citas" aria-current="page" data-i18n="nav.mis_citas">Mis Citas</a>
      <div id="sesionNav"></div>
      <!-- Selector de idioma -->
      <div class="lang-switcher" aria-label="Cambiar idioma">
        <button class="lang-btn lang-btn--active" data-lang="es" aria-pressed="true">ES</button>
        <button class="lang-btn" data-lang="gl" aria-pressed="false">GL</button>
      </div>
    </nav>
  </header>

  <!-- HERO pequeño -->
  <section class="hero hero--small" aria-labelledby="citas-heading">
    <div class="hero__big-text" role="heading" aria-level="1" id="citas-heading">
      <span class="hero__word" data-i18n="citas.title">MIS CITAS</span>
    </div>
  </section>

  <!-- CONTENIDO -->
  <main class="page-section">

    <!-- Barra de acciones superior -->
    <div class="citas-topbar">
      <a href="/#agendar" class="btn btn--outline" data-i18n="citas.nueva">+ Nueva Cita</a>
      <button class="btn btn--ghost" id="btnVerPerfil" aria-label="Ver y editar mi perfil" data-i18n="citas.mi_perfil">
        Mi Perfil
      </button>
    </div>

    <!-- Tabs: Próximas / Historial -->
    <div class="citas-tabs" role="tablist" aria-label="Sección de citas">
      <button class="citas-tab citas-tab--active" id="tabProximas"
        role="tab" aria-selected="true" aria-controls="panelProximas" data-i18n="citas.proximas">
        Próximas citas
      </button>
      <button class="citas-tab" id="tabHistorial"
        role="tab" aria-selected="false" aria-controls="panelHistorial" data-i18n="citas.historial">
        Historial
      </button>
    </div>

    <!-- Panel: Próximas -->
    <div id="panelProximas" role="tabpanel">
      <div class="galeria__filtros" id="filtrosEstadoProximas" role="group" aria-label="Filtrar próximas por estado">
        <button class="filtro-btn filtro-btn--active" data-estado="" aria-pressed="true" data-i18n="citas.todas">Todas</button>
        <button class="filtro-btn" data-estado="Pendiente"  aria-pressed="false" data-i18n="citas.pendiente">Pendiente</button>
        <button class="filtro-btn" data-estado="Confirmada" aria-pressed="false" data-i18n="citas.confirmada">Confirmada</button>
      </div>
      <div id="citasProximasLista" class="citas-lista" aria-live="polite">
        <p class="citas-cargando" data-i18n="citas.cargando">Cargando...</p>
      </div>
    </div>

    <!-- Panel: Historial -->
    <div id="panelHistorial" role="tabpanel" hidden>
      <div class="galeria__filtros" id="filtrosEstadoHistorial" role="group" aria-label="Filtrar historial por estado">
        <button class="filtro-btn filtro-btn--active" data-estado="" aria-pressed="true" data-i18n="citas.todas">Todas</button>
        <button class="filtro-btn" data-estado="Finalizada" aria-pressed="false" data-i18n="citas.finalizada">Finalizada</button>
        <button class="filtro-btn" data-estado="Cancelada"  aria-pressed="false" data-i18n="citas.cancelada">Cancelada</button>
      </div>
      <div id="citasHistorialLista" class="citas-lista" aria-live="polite">
        <p class="citas-cargando" data-i18n="citas.cargando">Cargando...</p>
      </div>
    </div>

  </main>

  <!-- ══════════════════════════════════════════════════
       MODAL: MODIFICAR CITA
  ══════════════════════════════════════════════════ -->
  <div class="modal-overlay" id="modalEditarCita" hidden aria-modal="true" role="dialog"
       aria-labelledby="modalEditarTitulo">
    <div class="modal">
      <div class="modal__header">
        <h2 class="modal__titulo" id="modalEditarTitulo" data-i18n="modal.modificar_cita">Modificar Cita</h2>
        <button class="modal__cerrar" id="btnCerrarModalCita" aria-label="Cerrar">&times;</button>
      </div>
      <form id="formEditarCita" novalidate>
        <input type="hidden" id="editCitaId" />

        <div class="form-group">
          <label for="editBarbero">Barbero <span class="required-mark">*</span></label>
          <select id="editBarbero" aria-required="true">
            <option value="">— Selecciona un barbero —</option>
          </select>
          <span class="form-error" id="error-editBarbero" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="editServicio">Servicio <span class="required-mark">*</span></label>
          <select id="editServicio" aria-required="true">
            <option value="">— Selecciona un servicio —</option>
          </select>
          <span class="form-error" id="error-editServicio" role="alert"></span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="editFecha">Fecha <span class="required-mark">*</span></label>
            <input type="date" id="editFecha" aria-required="true" />
            <span class="form-error" id="error-editFecha" role="alert"></span>
          </div>
          <div class="form-group">
            <label for="editHora">Hora <span class="required-mark">*</span></label>
            <input type="time" id="editHora" min="09:00" max="18:30" step="1800" aria-required="true" />
            <span class="form-hint">9:00 a 19:00 hrs</span>
            <span class="form-error" id="error-editHora" role="alert"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="editObservaciones">Observaciones</label>
          <input type="text" id="editObservaciones" placeholder="Opcional" maxlength="200" />
        </div>

        <div class="modal__acciones">
          <button type="submit" class="btn btn--dark" id="btnGuardarCita">Guardar cambios</button>
          <button type="button" class="btn btn--outline" id="btnCancelarModalCita">Cancelar</button>
        </div>

        <div class="form-mensaje" id="editCitaMensaje" role="alert" aria-live="assertive"></div>
      </form>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════
       MODAL: MI PERFIL
  ══════════════════════════════════════════════════ -->
  <div class="modal-overlay" id="modalPerfil" hidden aria-modal="true" role="dialog"
       aria-labelledby="modalPerfilTitulo">
    <div class="modal">
      <div class="modal__header">
        <h2 class="modal__titulo" id="modalPerfilTitulo" data-i18n="perfil.title">Mi Perfil</h2>
        <button class="modal__cerrar" id="btnCerrarModalPerfil" aria-label="Cerrar">&times;</button>
      </div>

      <!-- Pestañas dentro del modal -->
      <div class="modal-tabs" role="tablist">
        <button class="modal-tab modal-tab--active" id="tabDatos"
          role="tab" aria-selected="true" aria-controls="panelDatos" data-i18n="perfil_misDatos" >Mis Datos</button>
        <button class="modal-tab" id="tabPassword"
          role="tab" aria-selected="false" aria-controls="panelPassword" data-i18n="perfil_misContraseñas">Contraseña</button>
      </div>

      <!-- Panel: Editar datos -->
      <div id="panelDatos" role="tabpanel">
        <form id="formPerfil" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label for="perfNombre" data-i18n="perfil_nombre" >Nombre <span class="required-mark">*</span></label>
              <input type="text" id="perfNombre" aria-required="true" autocomplete="given-name" />
              <span class="form-error" id="error-perfNombre" role="alert"></span>
            </div>
            <div class="form-group">
              <label for="perfApellido" data-i18n="perfil_apellido">Apellido <span class="required-mark">*</span></label>
              <input type="text" id="perfApellido" aria-required="true" autocomplete="family-name" />
              <span class="form-error" id="error-perfApellido" role="alert"></span>
            </div>
          </div>
          <div class="form-group">
            <label for="perfTelefono">Teléfono <span class="required-mark">*</span></label>
            <input type="tel" id="perfTelefono" aria-required="true" autocomplete="tel" />
            <span class="form-error" id="error-perfTelefono" role="alert"></span>
          </div>
          <div class="form-group">
            <label for="perfEmail">Email</label>
            <input type="email" id="perfEmail" disabled aria-disabled="true"
              title="El email no se puede cambiar" />
            <span class="form-hint">El email no se puede modificar.</span>
          </div>
          <div class="modal__acciones">
            <button type="submit" class="btn btn--dark" id="btnGuardarPerfil" data-i18n="formBtn_guardarCambios" >Guardar cambios</button>
          </div>
          <div class="form-mensaje" id="perfilMensaje" role="alert" aria-live="assertive"></div>
        </form>
      </div>

      <!-- Panel: Cambiar contraseña -->
      <div id="panelPassword" role="tabpanel" hidden>
        <form id="formPassword" novalidate>
          <div class="form-group">
            <label for="pwdActual">Contraseña actual <span class="required-mark">*</span></label>
            <input type="password" id="pwdActual" aria-required="true" autocomplete="current-password" />
            <span class="form-error" id="error-pwdActual" role="alert"></span>
          </div>
          <div class="form-group">
            <label for="pwdNueva">Nueva contraseña <span class="required-mark">*</span></label>
            <input type="password" id="pwdNueva" placeholder="Mínimo 6 caracteres"
              aria-required="true" autocomplete="new-password" />
            <span class="form-error" id="error-pwdNueva" role="alert"></span>
          </div>
          <div class="form-group">
            <label for="pwdConfirmar">Confirmar nueva contraseña <span class="required-mark">*</span></label>
            <input type="password" id="pwdConfirmar" aria-required="true" autocomplete="new-password" />
            <span class="form-error" id="error-pwdConfirmar" role="alert"></span>
          </div>
          <div class="modal__acciones">
            <button type="submit" class="btn btn--dark" id="btnGuardarPassword">Cambiar contraseña</button>
          </div>
          <div class="form-mensaje" id="passwordMensaje" role="alert" aria-live="assertive"></div>
        </form>
      </div>

    </div>
  </div>

  <footer class="footer footer--simple" role="contentinfo">
    <span>© 2026 BarberKing — Ourense</span>
    <span class="footer__legal-links">
      <a href="/politica-de-privacidad">Privacidad</a>
      <a href="/aviso-legal">Aviso legal</a>
      <a href="/politica-de-cookies">Cookies</a>
    </span>
  </footer>

  <script src="{{ url_for('static', filename='i18n/i18n.js') }}?v=1"></script>
  <script src="{{ url_for('static', filename='auth.js') }}?v=2"></script>
  <script src="{{ url_for('static', filename='mis_citas.js') }}?v=2"></script>
</body>
</html>
